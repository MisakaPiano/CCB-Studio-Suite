<div id="prompt-reference-proposal" class="viz-carousel" aria-label="多来源 Prompt 工作台布局" data-previous-label="上一布局" data-next-label="下一布局">
  <section data-variant="底部摘取（推荐）" aria-label="底部摘取布局"><div class="p-app" data-layout="bottom"></div></section>
  <section data-variant="右侧摘取" aria-label="右侧摘取布局" hidden><div class="p-app" data-layout="right"></div></section>
</div>
<template id="prompt-reference-shell">
  <header class="p-chrome"><strong>▧ Studio Suite</strong><span>创作</span><span>AI 设计</span><span>图库</span><span>编辑</span><span class="p-active">资产管理</span><small>交互概念 · 合成资料</small></header>
  <div class="p-tabs"><span>Prompt 资产</span><strong>多 Prompt 参照</strong><span>目录入口</span><span>回收站</span><span>备份与恢复</span></div>
  <div class="p-bar"><strong>多来源对比</strong><span class="p-source-count"></span><button data-do="sources"><i data-lucide="plus" aria-hidden="true"></i>添加来源</button><span class="p-space"></span><button class="p-quiet" data-do="draft">当前创作</button><button class="p-quiet" data-do="help" aria-label="对比操作说明"><i data-lucide="circle-help" aria-hidden="true"></i></button></div>
  <div class="p-bar p-filter"><div class="p-segment"><button data-panel="prompt" aria-pressed="true">Prompt 字段</button><button data-panel="params" aria-pressed="false">生成参数</button></div><label><input type="checkbox" class="p-diff">仅看差异</label><span class="p-space"></span><span class="p-muted">角色对齐只改变展示位置</span></div>
  <div class="p-work"><div class="p-sheet" aria-label="按字段对齐的多来源对比"><table><thead></thead><tbody></tbody></table></div><aside class="p-excerpt" aria-label="独立摘取草稿"><div class="p-bar"><strong>摘取草稿</strong><span class="p-space"></span><button class="p-quiet" data-do="clear">清空</button></div><textarea class="p-excerpt-text" aria-label="编辑摘取草稿" placeholder="从上方任意来源摘取字段，或先选择部分原文再摘取"></textarea><div class="p-origins p-muted"></div><div class="p-bar p-excerpt-actions"><button data-do="copy"><i data-lucide="copy" aria-hidden="true"></i>复制</button><button data-do="save">保存为 Prompt</button><span class="p-space"></span><button data-do="apply" class="p-primary">预览应用</button></div></aside></div>
  <footer class="p-bar p-footer"><button class="p-quiet" data-do="undo" aria-label="撤销"><i data-lucide="undo-2" aria-hidden="true"></i></button><button class="p-quiet" data-do="redo" aria-label="重做"><i data-lucide="redo-2" aria-hidden="true"></i></button><span class="p-status" role="status" aria-live="polite">原文只读 · 摘取不自动发送给 AI</span></footer>
  <dialog class="p-dialog"><div class="p-dialog-body"></div></dialog>
</template>
<style>

#prompt-reference-proposal .p-chrome{display:flex;align-items:center;gap:20px;padding:10px 100px 10px 13px;background:var(--p-panel);border-bottom:1px solid var(--p-line);flex-wrap:wrap}#prompt-reference-proposal strong{font-weight:500}#prompt-reference-proposal .p-chrome strong{margin-right:10px}#prompt-reference-proposal small{font-size:12px;color:var(--p-dim)}#prompt-reference-proposal .p-chrome small{margin-left:auto}#prompt-reference-proposal .p-active{color:var(--p-accent)}
#prompt-reference-proposal .p-tabs{display:flex;gap:20px;padding:9px 12px;border-bottom:1px solid var(--p-line);flex-wrap:wrap;color:var(--p-dim)}#prompt-reference-proposal .p-tabs strong{color:var(--p-text)}#prompt-reference-proposal .p-bar{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:7px 12px;min-width:0}#prompt-reference-proposal .p-space{flex:1;min-width:0}#prompt-reference-proposal .p-filter{background:var(--p-panel);border-block:1px solid var(--p-line)}#prompt-reference-proposal label{display:inline-flex;gap:4px;align-items:center}#prompt-reference-proposal .p-muted{color:var(--p-dim);font-size:12px}#prompt-reference-proposal .p-segment{display:flex;gap:0}#prompt-reference-proposal .p-segment button{border-radius:0}#prompt-reference-proposal .p-segment button:first-child{border-radius:5px 0 0 5px}#prompt-reference-proposal .p-segment button:last-child{border-radius:0 5px 5px 0}
#prompt-reference-proposal .p-work{display:grid;min-width:0}#prompt-reference-proposal .p-sheet{overflow:auto;max-height:430px;min-height:390px;min-width:0;scrollbar-color:var(--p-line) var(--p-panel)}#prompt-reference-proposal table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}#prompt-reference-proposal th,#prompt-reference-proposal td{text-align:left;vertical-align:top;border-bottom:1px solid var(--p-line);border-right:1px solid var(--p-line);padding:10px;overflow-wrap:anywhere;font-weight:400}#prompt-reference-proposal th:first-child,#prompt-reference-proposal td:first-child{width:108px;position:sticky;left:0;background:var(--p-panel);z-index:1}#prompt-reference-proposal th{position:sticky;top:0;background:var(--p-bg);z-index:2}#prompt-reference-proposal th:first-child{z-index:3}#prompt-reference-proposal .p-source-title{display:flex;gap:5px;align-items:center}#prompt-reference-proposal .p-source-title strong{flex:1}#prompt-reference-proposal .p-source-title button{padding:3px;min-height:26px}#prompt-reference-proposal .p-art{height:var(--p-image-height,88px);margin:8px 0;border-radius:4px;background:var(--p-panel);display:flex;gap:10px;align-items:center;justify-content:center;color:var(--p-dim)}#prompt-reference-proposal .p-art span{display:block;width:30px;height:40px;border:2px solid var(--p-accent);border-radius:40% 40% 7px 7px;opacity:.65}#prompt-reference-proposal .p-art span:nth-child(2){height:50px}#prompt-reference-proposal .p-text{white-space:pre-wrap;max-height:132px;overflow:auto;user-select:text;margin-bottom:8px}#prompt-reference-proposal .p-cell-actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap}#prompt-reference-proposal .p-cell-actions button{font-size:12px;min-height:26px;padding:3px 6px}#prompt-reference-proposal mark{background:var(--p-selected);color:var(--p-accent)}#prompt-reference-proposal .p-role-title{display:flex;gap:4px;align-items:center;flex-wrap:wrap;background:var(--p-panel);padding:5px;border-radius:4px;margin-bottom:6px}#prompt-reference-proposal .p-role-title button{padding:2px 5px;min-height:25px}#prompt-reference-proposal .p-role-title button[draggable]{flex:1;justify-content:flex-start;cursor:grab;white-space:normal;text-align:left}#prompt-reference-proposal .p-drop{outline:2px solid var(--p-accent);outline-offset:-2px}
#prompt-reference-proposal .p-excerpt{min-width:0;border-top:1px solid var(--p-line);background:var(--p-panel)}#prompt-reference-proposal .p-excerpt .p-bar{padding:5px 12px}#prompt-reference-proposal textarea{background:var(--p-bg);border:1px solid var(--p-line);border-radius:5px;padding:8px;resize:vertical;min-width:0}#prompt-reference-proposal .p-excerpt-text{display:block;margin:0 12px;width:calc(100% - 24px);min-height:88px;max-height:240px}#prompt-reference-proposal .p-origins{padding:4px 12px;min-height:25px;max-height:60px;overflow:auto;overflow-wrap:anywhere}#prompt-reference-proposal .p-footer{border-top:1px solid var(--p-line);color:var(--p-dim);font-size:12px;min-height:44px}#prompt-reference-proposal .p-status{flex:1}
#prompt-reference-proposal [data-layout=right] .p-work{grid-template-columns:minmax(0,1fr) 250px}#prompt-reference-proposal [data-layout=right] .p-sheet{max-height:625px;min-height:625px}#prompt-reference-proposal [data-layout=right] .p-excerpt{border-left:1px solid var(--p-line);border-top:0}#prompt-reference-proposal [data-layout=right] .p-excerpt-text{min-height:360px}#prompt-reference-proposal [data-layout=right] .p-excerpt-actions{align-content:flex-start}
#prompt-reference-proposal .p-dialog{max-width:min(660px,calc(100% - 24px));width:660px;max-height:80vh;overflow:auto;background:var(--p-panel);color:var(--p-text);border:1px solid var(--p-line);border-radius:8px;padding:16px}#prompt-reference-proposal .p-dialog::backdrop{background:light-dark(#202f4344,#00000088)}#prompt-reference-proposal .p-dialog h3{font-size:16px;font-weight:500;margin:0 0 10px}#prompt-reference-proposal .p-dialog p{margin:7px 0;white-space:pre-wrap;overflow-wrap:anywhere}#prompt-reference-proposal .p-dialog textarea{width:100%;min-height:120px}#prompt-reference-proposal .p-picker-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--p-line)}#prompt-reference-proposal .p-picker-row div{flex:1}#prompt-reference-proposal .p-picker-row small{display:block}#prompt-reference-proposal pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:350px;overflow:auto;font:inherit;background:var(--p-bg);padding:10px}#prompt-reference-proposal .p-dialog-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
@media(max-width:760px){#prompt-reference-proposal [data-layout=right] .p-work{grid-template-columns:1fr}#prompt-reference-proposal [data-layout=right] .p-sheet{min-height:390px;max-height:430px}#prompt-reference-proposal [data-layout=right] .p-excerpt{border-left:0;border-top:1px solid var(--p-line)}#prompt-reference-proposal [data-layout=right] .p-excerpt-text{min-height:88px}#prompt-reference-proposal .p-chrome{gap:12px}#prompt-reference-proposal .p-filter>.p-muted{width:100%}#prompt-reference-proposal .p-dialog{max-height:90vh}}
</style>
<script>
(()=>{
const root=document.getElementById('prompt-reference-proposal');
const fixtures={
 ai:{id:'ai',name:'AI 设计候选',kind:'AI 候选',origin:'合成会话 / 第 2 轮候选 · 未联网',fields:{style:'watercolor, soft light',base:'two friends, birthday party, garden',negative:'blurry, lowres'},roles:[{id:'A',text:'green scarf, short hair',negative:'hat'},{id:'B',text:'blue coat, long hair',negative:'glasses'}],params:{'目标模型':'V5 Full（设计目标）','实际生图模型':'未记录','实际 Seed':'未记录','Steps':'未记录'},image:false},
 image:{id:'image',name:'图片中的 Prompt',kind:'图片参数',origin:'合成图 sample-garden.png · 参数读取示例',fields:{style:'watercolor, warm light',base:'two friends, birthday party, garden, balloons',negative:'blurry, lowres'},roles:[{id:'B',text:'blue coat, long hair',negative:'glasses'},{id:'A',text:'green scarf, short hair',negative:'hat'}],params:{'目标模型':'未记录','实际生图模型':'V5 Full（合成示例）','实际 Seed':'123456（合成示例）','Steps':'28（合成示例）'},image:true},
 text:{id:'text',name:'独立文字 Prompt',kind:'独立文字',origin:'手动粘贴 · 合成示例',fields:{raw:'garden, birthday, colorful balloons'},roles:[],params:{'目标模型':'未记录','实际生图模型':'未记录','实际 Seed':'未记录','Steps':'未记录'},image:false}
};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=x=>JSON.parse(JSON.stringify(x));
const fieldNames={style:'画风',base:'基础 Prompt',negative:'负向 Prompt',raw:'独立原文'};
function build(app){
 app.append(document.getElementById('prompt-reference-shell').content.cloneNode(true));
 const layout=app.dataset.layout;const $=s=>app.querySelector(s);const dialog=$('.p-dialog');
 let sources=clone(fixtures),ids=['ai','image','text'],orders={ai:['A','B'],image:['B','A'],text:[]},excerpt='',origins=[],panel='prompt',diff=false,draft='garden, morning light',undo=[],redo=[],saved=0;
 const ui={imageHeight:88};
 const snapshot=()=>clone({ids,orders,excerpt,origins,draft});
 function history(){undo.push(snapshot());undo=undo.slice(-100);redo=[];}
 function restore(s){ids=s.ids.filter(id=>sources[id]);orders=s.orders;excerpt=s.excerpt;origins=s.origins;draft=s.draft;render();}
 function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{concept:'多来源 Prompt 对比',layout,sourceKinds:ids.map(id=>sources[id].kind),displayRoleOrders:orders},privateContent:{panel,diff,imageHeight:ui.imageHeight}}).catch(()=>{});}
 function status(s){$('.p-status').textContent=s;}
 function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
 function open(title,body,actions=[]){$('.p-dialog-body').innerHTML=`<h3>${esc(title)}</h3>${body}<div class="p-dialog-actions">${actions.map((a,i)=>`<button data-dialog-action="${i}">${esc(a.label)}</button>`).join('')}<button data-close>关闭</button></div>`;$('.p-dialog-body').querySelector('[data-close]').onclick=()=>dialog.close();actions.forEach((a,i)=>$('.p-dialog-body').querySelector(`[data-dialog-action="${i}"]`).onclick=a.run);if(!dialog.open)dialog.showModal();icons();}
 function sourcesPicker(){open('添加参照来源',`<div class="p-picker">${Object.values(sources).map(s=>`<div class="p-picker-row"><div>${esc(s.name)}<small>${esc(s.origin)}</small></div><button data-add="${s.id}" ${ids.includes(s.id)?'disabled':''}>${ids.includes(s.id)?'已加入':'加入'}</button></div>`).join('')}<div class="p-picker-row"><div>无参数图片.png<small>没有可读的非空 Prompt</small></div><button disabled>不可加入</button></div></div><div class="p-bar"><button data-new-text>粘贴 / 输入独立文字</button></div>`,[]);
  dialog.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{if(ids.length>=16){status('最多 16 个来源');return;}history();ids.push(b.dataset.add);render();persist();sourcesPicker();});
  dialog.querySelector('[data-new-text]').onclick=()=>{open('独立文字加入参照','<textarea aria-label="独立文字原文" placeholder="保留原文，不先覆盖当前创作"></textarea>',[{label:'保存并加入',run:()=>{const text=dialog.querySelector('textarea').value;if(!text.trim()){dialog.querySelector('textarea').setCustomValidity('请输入非空原文');dialog.querySelector('textarea').reportValidity();return;}if(ids.length>=16){status('最多 16 个来源');return;}history();const id='text-'+Object.keys(sources).length;sources[id]={id,name:'新文字参照',kind:'独立文字',origin:'本次输入 · 概念内存示例',fields:{raw:text},roles:[],params:fixtures.text.params};orders[id]=[];ids.push(id);dialog.close();render();status('已独立加入；当前创作不变');persist();}}]);};
 }
 function take(id,key,text){const cell=app.querySelector(`[data-cell="${id}:${key}"] .p-text`);const selection=window.getSelection();const chosen=selection&&!selection.isCollapsed&&cell?.contains(selection.anchorNode)&&cell.contains(selection.focusNode)?selection.toString():text;history();excerpt+=(excerpt?'\n':'')+chosen;const origin=sources[id].name+' / '+key;if(!origins.includes(origin))origins.push(origin);renderExcerpt();status('已摘取；原来源与当前创作不变');persist();}
 function moveRole(id,index,to){if(to<0||to>=orders[id].length)return;history();const role=orders[id].splice(index,1)[0];orders[id].splice(to,0,role);render();status('只移动参照位置；原始角色顺序保留');persist();}
 function rich(text,other){const common=other.map(x=>x.split(/,|\n/).map(s=>s.trim()).filter(Boolean));return text.split(/(,|\n)/).map(part=>{const p=part.trim();return p&&p!==','&&common.length>1&&!common.every(a=>a.includes(p))?`<mark>${esc(part)}</mark>`:esc(part);}).join('');}
 function cell(id,key,text,other){return `<td data-cell="${id}:${esc(key)}">${text?`<div class="p-text">${rich(text,other)}</div><div class="p-cell-actions"><button data-take="${esc(id)}" data-key="${esc(key)}">摘取</button><button class="p-quiet" data-full="${esc(id)}" data-key="${esc(key)}">完整原文</button></div>`:'<span class="p-muted">— 此来源无该字段</span>'}</td>`;}
 function values(id,key){if(key.startsWith('role:')){const [,at,field]=key.split(':');const role=sources[id].roles.find(r=>r.id===orders[id][Number(at)]);return role?.[field]||'';}return sources[id].fields[key]||'';}
 function row(key,label){const texts=ids.map(id=>values(id,key));const nonempty=texts.filter(t=>t.trim());if(!nonempty.length||diff&&new Set(nonempty).size<2)return '';return `<tr><td>${esc(label)}</td>${ids.map(id=>cell(id,key,values(id,key),nonempty)).join('')}</tr>`;}
 function renderExcerpt(){const t=$('.p-excerpt-text');if(t.value!==excerpt)t.value=excerpt;$('.p-origins').textContent='来源：'+(origins.join('；')||'尚未摘取');['copy','save','apply','clear'].forEach(a=>app.querySelector(`[data-do="${a}"]`).disabled=!excerpt.trim());$('[data-do="undo"]').disabled=!undo.length;$('[data-do="redo"]').disabled=!redo.length;}
 function render(){
  app.style.setProperty('--p-image-height',ui.imageHeight+'px');$('.p-source-count').textContent=ids.length+' / 16 来源';
  app.querySelectorAll('[data-panel]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.panel===panel)));$('.p-diff').checked=diff;
  const table=$('table');table.style.minWidth=(108+ids.length*245)+'px';
  $('thead').innerHTML='<tr><th>字段 / 来源</th>'+ids.map(id=>{const s=sources[id];return `<th><div class="p-source-title"><strong>${esc(s.name)}</strong><button data-info="${id}" aria-label="${esc(s.name)}来源详情"><i data-lucide="info" aria-hidden="true"></i></button><button data-remove="${id}" aria-label="移出${esc(s.name)}"><i data-lucide="x" aria-hidden="true"></i></button></div><small>${esc(s.kind)}</small><div class="p-art">${s.image?'<span></span><span></span>':esc(s.kind==='AI 候选'?'合成候选 · 未联网':'独立原文 · 无图片')}</div><small>${esc(s.origin)}</small></th>`;}).join('')+'</tr>';
  let body='';if(panel==='prompt'){
   for(const [key,label] of Object.entries(fieldNames))body+=row(key,label);
   for(let i=0;i<Math.max(0,...ids.map(id=>orders[id]?.length||0));i++){
    body+=`<tr><td>角色位置 ${i+1}</td>`+ids.map(id=>{const role=sources[id].roles.find(r=>r.id===orders[id][i]);return `<td data-role-source="${id}" data-role-index="${i}">${role?`<div class="p-role-title"><button draggable="false" data-drag-role="${id}:${i}" aria-label="拖动${esc(sources[id].name)}角色${i+1}"><i data-lucide="grip-vertical" aria-hidden="true"></i>原始角色 ${role.id}</button><button data-role-up="${id}:${i}" aria-label="${esc(sources[id].name)}角色${i+1}上移" ${i===0?'disabled':''}>↑</button><button data-role-down="${id}:${i}" aria-label="${esc(sources[id].name)}角色${i+1}下移" ${i===orders[id].length-1?'disabled':''}>↓</button></div><small>仅参照位置；原始角色 ${role.id}</small>`:'<small>— 无对应角色</small>'}</td>`;}).join('')+'</tr>';
    body+=row('role:'+i+':text','角色正向')+row('role:'+i+':negative','角色负向');
   }
  }else{for(const key of ['目标模型','实际生图模型','实际 Seed','Steps']){const texts=ids.map(id=>sources[id].params[key]||'未记录');if(diff&&new Set(texts).size<2)continue;body+=`<tr><td>${key}</td>${texts.map(t=>`<td>${esc(t)}</td>`).join('')}</tr>`;}}
  $('tbody').innerHTML=body||'<tr><td colspan="'+(ids.length+1)+'">'+(ids.length?'当前条件下没有差异':'从“添加来源”开始')+'</td></tr>';
  app.querySelectorAll('[data-take]').forEach(b=>b.onclick=()=>take(b.dataset.take,b.dataset.key,values(b.dataset.take,b.dataset.key)));
  app.querySelectorAll('[data-full]').forEach(b=>b.onclick=()=>open('完整原文 · '+sources[b.dataset.full].name,`<pre>${esc(values(b.dataset.full,b.dataset.key))}</pre>`));
  app.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{history();ids=ids.filter(id=>id!==b.dataset.remove);render();status('仅移出参照，原资产保留；可撤销');persist();});
  app.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>{const s=sources[b.dataset.info];open(s.name+' · 来源详情',`<p>${esc(s.origin)}</p><p>原始角色顺序：${s.roles.map(r=>r.id).join(' → ')||'无结构化角色'}</p><p>参照展示顺序：${orders[s.id].join(' → ')||'无'}</p><p>当前创作与账户未因加入而改变。</p>`,s.image?[{label:'保存的 Recipe',run:()=>open('保存的 Recipe · 合成示例','<pre>'+esc(JSON.stringify({model:'V5 Full',prompt:s.fields,roles:s.roles},null,2))+'</pre>')},{label:'实际请求快照',run:()=>open('实际请求快照','<p>此合成图没有已验证的实际发送请求，保持“未记录”。</p>')}]:[]);});
  for(const [attr,delta] of [['roleUp',-1],['roleDown',1]])app.querySelectorAll('[data-'+attr.replace(/[A-Z]/g,c=>'-'+c.toLowerCase())+']').forEach(b=>b.onclick=()=>{const [id,i]=b.dataset[attr].split(':');moveRole(id,Number(i),Number(i)+delta);});
  app.querySelectorAll('[data-drag-role]').forEach(b=>{
   let drag=null;
   b.onpointerdown=e=>{if(e.button!==0)return;const [id,at]=b.dataset.dragRole.split(':');drag={id,at:Number(at),x:e.clientX,y:e.clientY,moved:false};b.setPointerCapture(e.pointerId);};
   b.onpointermove=e=>{if(!drag)return;drag.moved=drag.moved||Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>5;app.querySelectorAll('.p-drop').forEach(t=>t.classList.remove('p-drop'));if(drag.moved){e.preventDefault();const td=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-role-source]');if(td&&td.dataset.roleSource===drag.id)td.classList.add('p-drop');}};
   b.onpointerup=e=>{const d=drag;drag=null;app.querySelectorAll('.p-drop').forEach(t=>t.classList.remove('p-drop'));if(d?.moved){const td=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-role-source]');if(td&&td.dataset.roleSource===d.id)moveRole(d.id,d.at,Number(td.dataset.roleIndex));}};
   b.onpointercancel=()=>{drag=null;app.querySelectorAll('.p-drop').forEach(t=>t.classList.remove('p-drop'));};
  });
  app.querySelectorAll('[data-role-source]').forEach(td=>{td.ondragover=e=>{e.preventDefault();td.classList.add('p-drop');};td.ondragleave=()=>td.classList.remove('p-drop');td.ondrop=e=>{e.preventDefault();td.classList.remove('p-drop');const [id,at]=e.dataTransfer.getData('text/plain').split(':');if(id===td.dataset.roleSource&&Number.isInteger(Number(at)))moveRole(id,Number(at),Number(td.dataset.roleIndex));};});
  renderExcerpt();icons();
 }
 app.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{panel=b.dataset.panel;render();persist();});$('.p-diff').onchange=e=>{diff=e.target.checked;render();persist();};
 $('.p-excerpt-text').oninput=e=>{history();excerpt=e.target.value;renderExcerpt();};
 app.querySelectorAll('[data-do]').forEach(b=>b.onclick=()=>{
  switch(b.dataset.do){
   case 'sources':sourcesPicker();break;
   case 'clear':history();excerpt='';origins=[];renderExcerpt();persist();break;
   case 'undo':if(undo.length){redo.push(snapshot());restore(undo.pop());status('已撤销');persist();}break;
   case 'redo':if(redo.length){undo.push(snapshot());restore(redo.pop());status('已重做');persist();}break;
   case 'draft':open('当前创作 · 基础 Prompt',`<pre>${esc(draft)}</pre>`);break;
   case 'help':open('对比与摘取','<p>加入来源不覆盖当前创作，不发送 AI。空白字段不参与比较；独立文字保持原文，不猜测字段。</p><p>角色标题可在同一来源内拖动，也可用上下键按钮对齐；不改变原始角色顺序。</p><p>可以先选择部分原文再摘取。生成参数、保存的 Recipe 和实际请求快照分别辨认，未记录的信息保持未知。</p>');break;
   case 'save':{const existing=Object.values(sources).find(s=>s.savedExcerpt&&s.fields.raw===excerpt);if(!existing){saved++;const id='saved-'+saved;sources[id]={id,name:'摘取 Prompt '+saved,kind:'独立文字',origin:'摘取自 '+origins.join('；'),fields:{raw:excerpt},roles:[],params:fixtures.text.params,savedExcerpt:true};orders[id]=[];}status('已保存为概念内存中的 Prompt，可从添加来源重新选用');break;}
   case 'copy':if(navigator.clipboard?.writeText)navigator.clipboard.writeText(excerpt).then(()=>status('已复制摘取文字'),()=>open('复制摘取',`<textarea readonly aria-label="待复制的摘取文字">${esc(excerpt)}</textarea>`));else open('复制摘取',`<textarea readonly aria-label="待复制的摘取文字">${esc(excerpt)}</textarea>`);break;
   case 'apply':open('应用预览 · 基础 Prompt',`<small>当前</small><pre>${esc(draft)}</pre><small>应用后</small><pre>${esc(excerpt)}</pre><p class="p-muted">只更新本次预览的文本字段；不自动生成。</p>`,[{label:'取消应用',run:()=>dialog.close()},{label:'确认应用，可撤销',run:()=>{history();draft=excerpt;dialog.close();renderExcerpt();status('已应用到概念中的基础 Prompt；可撤销，未调用服务');persist();}}]);break;
  }
 });
 function applyHost(savedState){const s=savedState?.privateContent;if(s){panel=s.panel==='params'?'params':'prompt';diff=!!s.diff;if(Number.isFinite(s.imageHeight))ui.imageHeight=Math.min(160,Math.max(64,s.imageHeight));}render();}
 applyHost(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)applyHost(e.detail.globals.widgetState);});
 if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>{render();persist();}});tweak.addSlider(ui,'imageHeight',{label:'来源预览高度',min:64,max:160,step:8,unit:'px'});}
}
root.querySelectorAll('.p-app').forEach(build);
})();
</script>
