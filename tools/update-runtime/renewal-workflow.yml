name: Renew long-term update metadata
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: write
concurrency:
  group: suite-long-term-metadata
  cancel-in-progress: false
jobs:
  renew:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Install hash-locked signing dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r maintenance/requirements.txt
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: long-term-metadata
          path: state
      - name: Renew only snapshot and timestamp
        env:
          SUITE_SNAPSHOT_KEY_B64: ${{ secrets.SUITE_LONGTERM_SNAPSHOT_KEY_B64 }}
          SUITE_TIMESTAMP_KEY_B64: ${{ secrets.SUITE_LONGTERM_TIMESTAMP_KEY_B64 }}
        run: python maintenance/maintain_metadata.py --metadata state/preview/windows-x86_64/metadata --root-sha256 408008d80aeb2dd3844325d74f09da9d248733e220dd88c08cc6299c4a24cc7a
      - name: Publish verified renewal without force
        working-directory: state
        run: |
          git config user.name "CCB Suite metadata maintenance"
          git config user.email "metadata-maintenance@users.noreply.github.com"
          git add -- preview/windows-x86_64/metadata
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "maintenance: renew signed snapshot and timestamp"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refs/heads/long-term-metadata
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
